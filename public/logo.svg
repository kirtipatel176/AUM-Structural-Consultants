<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- White background -->
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- Structural building icon -->
  <!-- Base platform -->
  <rect x="96" y="310" width="320" height="14" rx="4" fill="#1a2744"/>

  <!-- Left column -->
  <rect x="112" y="160" width="18" height="152" fill="#1a2744"/>
  <!-- Right column -->
  <rect x="382" y="160" width="18" height="152" fill="#1a2744"/>

  <!-- Truss diagonals -->
  <line x1="130" y1="310" x2="256" y2="160" stroke="#1a2744" stroke-width="12" stroke-linecap="round"/>
  <line x1="382" y1="310" x2="256" y2="160" stroke="#1a2744" stroke-width="12" stroke-linecap="round"/>
  <line x1="130" y1="310" x2="320" y2="220" stroke="#1a2744" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
  <line x1="382" y1="310" x2="192" y2="220" stroke="#1a2744" stroke-width="8" stroke-linecap="round" opacity="0.55"/>

  <!-- Apex cap -->
  <polygon points="256,138 230,170 282,170" fill="#1a2744"/>

  <!-- Building floors (rectangles stacked) -->
  <rect x="204" y="200" width="104" height="16" rx="2" fill="#1a2744" opacity="0.75"/>
  <rect x="204" y="228" width="104" height="16" rx="2" fill="#1a2744" opacity="0.65"/>
  <rect x="194" y="256" width="124" height="16" rx="2" fill="#1a2744" opacity="0.55"/>
  <rect x="184" y="284" width="144" height="16" rx="2" fill="#1a2744" opacity="0.45"/>

  <!-- AUM Text -->
  <text x="256" y="388" font-family="'Arial Black', 'Arial', sans-serif" font-size="88" font-weight="900" text-anchor="middle" fill="#1a2744" letter-spacing="6">AUM</text>

  <!-- Tagline -->
  <text x="256" y="430" font-family="'Arial', sans-serif" font-size="22" font-weight="500" text-anchor="middle" fill="#1a2744" letter-spacing="5">STRUCTURAL CONSULTANTS</text>
</svg>
